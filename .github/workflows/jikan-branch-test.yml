name: Test Jikan Integration

on:
  push:
    branches: ["feature/jikan-integration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline script not found');
          new Function(match[1]);
          console.log('Inline JavaScript syntax OK');
          NODE

      - name: Validate AniVote feature markers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'function submitVote(id)',
            'function adminPolls()',
            'function adminVotes()',
            'syncJikanAnime(false);',
            'https://api.jikan.moe/v4/seasons/now?sfw=true'
          ];
          for (const item of required) {
            if (!html.includes(item)) throw new Error('Missing required feature: ' + item);
          }
          console.log('Core AniVote features preserved');
          NODE

      - name: Validate Jikan current-season response
        run: |
          node <<'NODE'
          const url = 'https://api.jikan.moe/v4/seasons/now?sfw=true';
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error('Jikan HTTP ' + res.status);
          const body = await res.json();
          if (!Array.isArray(body.data) || body.data.length < 8) {
            throw new Error('Jikan returned insufficient anime data');
          }
          const usable = body.data.filter(x => x && x.mal_id && x.title && x.images);
          if (usable.length < 8) throw new Error('Jikan data is missing required anime metadata');
          console.log('Jikan response OK with', usable.length, 'usable anime entries');
          NODE

      - name: Static site smoke test
        run: |
          python3 -m http.server 8080 >/tmp/anivote-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8080/index.html | grep -q "AniVote"
          echo "Static site smoke test OK"
