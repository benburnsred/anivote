<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f6f6f8;--card:#fff;--ink:#1d1b22;--muted:#6b6878;--line:#e3e1e8;--accent:#a8761f;--bad:#b3261e;--good:#1e7b3a;--vote:#3b6fd8;--special:#c98a12;--lock:#8a8798;--warn:#b86e00}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#16141c;color:#fff}
header h1{margin:0;font-size:17px}
header .me{color:#b9b5c6;font-size:12px}
nav{display:flex;gap:2px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);font:inherit;font-weight:600;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.card > .head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.card > .body{border-top:1px solid var(--line);padding:14px}
.title{font-weight:700;flex:1;min-width:0}
.meta{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eee;color:#444;margin-left:6px}
.tag.special{background:#fbefd5;color:#8a5a00}
.tag.closed{background:#fde4e1;color:var(--bad)}
.tag.locked{background:#e4ecfd;color:#2a4a9a}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#bbb}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:var(--bad)}
button.icon{padding:4px 8px}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.tie td{background:#fff8e6}
.thumb{width:34px;height:44px;object-fit:cover;border-radius:4px;background:#eee;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.note{color:var(--muted);font-size:12px;margin:6px 0 12px}
.hint{background:#fff8e6;border:1px solid #f1dfb2;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16141c;color:#fff;padding:9px 14px;border-radius:6px;display:none;max-width:90%}
#toast.err{background:var(--bad)}
#saving{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#a8761f;color:#fff;font-weight:700;font-size:13px;padding:7px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#saving::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-1px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.busy main{pointer-events:none;opacity:.75;transition:opacity .2s}
#loading{padding:40px;text-align:center;color:var(--muted)}
h2{font-size:15px;margin:18px 0 10px}
/* Status strip */
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1000px;margin:14px auto 0;padding:0 18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--lock);display:inline-block}
.pill.on{color:var(--good);border-color:#bfe3cb;background:#effaf2}.pill.on i{background:var(--good)}
.pill.off{color:var(--bad);border-color:#f3c9c4;background:#fdf1ef}.pill.off i{background:var(--bad)}
.pill.warn{color:var(--warn);border-color:#f1d6a6;background:#fff6e6}.pill.warn i{background:var(--warn)}
#publish.dirty{background:var(--warn);border-color:var(--warn)}
#publish.dirty::before{content:"● ";}
/* Category cards: colour by kind and state */
.card.cat{border-left:4px solid var(--vote)}
.card.cat.special{border-left-color:var(--special)}
.card.cat.locked{border-left-color:var(--lock);background:#fbfbfc}
.card.cat .done{color:var(--good);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* Grouped fields */
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 2px;margin:0 0 12px;background:#fcfcfd}
legend{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
fieldset.voting{border-color:#cfdcf7;background:#f6f9ff}fieldset.voting legend{color:var(--vote)}
fieldset.reveal{border-color:#f1dcae;background:#fffaf0}fieldset.reveal legend{color:var(--special)}
.nominees{border:1px solid var(--line);border-radius:8px;padding:4px 12px 12px;background:#fcfcfd;margin-top:6px}
.danger-zone{border-top:1px dashed #f3c9c4;margin-top:16px;padding-top:12px}
select.yes{border-color:#bfe3cb;background:#effaf2;color:var(--good);font-weight:700}
select.no{border-color:#e3e1e8;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Awards Admin</h1><div class="row"><span class="me" id="me"></span><a href="?page=committee" style="color:#e9c46a;font-size:12px">Committee page</a><button class="primary" id="publish">Publish to site</button></div></header>
<nav id="tabs"><button data-tab="proposals">Proposals</button><button data-tab="categories" class="on">Categories</button><button data-tab="results">Results</button><button data-tab="settings">Settings</button><button data-tab="activity">Activity</button></nav>
<div class="status" id="status"></div>
<main id="main"><div id="loading">Loading…</div></main>
<div id="toast"></div>
<div id="saving" hidden>Saving…</div>

<script>
let STATE = null, TAB = 'categories', OPEN = null, EDIT_NOM = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TIER_HINT = 'Tier list: voters drag nominees into S/A/B/C/D (5 to 1 points, S holds 1, A 2, B 3).';

function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2500); }

// Calls a server function and re-renders with the returned state.
// Calls a server function and re-renders with the returned state. A "Saving…" badge shows straight away, and the
// page ignores clicks until the save finishes so nothing is sent twice.
let BUSY = 0;
function busy(d){
  BUSY += d;
  document.body.classList.toggle('busy', BUSY > 0);
  $('#saving').hidden = BUSY <= 0;
}
function call(fn, ...args){
  busy(1);
  return new Promise(resolve => google.script.run
    .withSuccessHandler(s => { busy(-1); STATE = s; render(); resolve(s); })
    .withFailureHandler(e => { busy(-1); toast(e.message || String(e), true); resolve(null); })[fn](...args));
}

function open(c){
  if (c.type === 'special') return true;
  const now = new Date(), s = STATE.settings; // one voting window for the whole event
  return s.vote_open !== 'FALSE' && !(s.voting_opens && now < new Date(s.voting_opens)) && !(s.voting_closes && now > new Date(s.voting_closes));
}
const nomsOf = id => STATE.nominees.filter(n => n.category_id === id);
const methodLabel = c => c.type === 'special' ? 'Special award: committee picks the winner' : (STATE.methods[c.method] || STATE.methods.tier).replace('N', c.max_picks || 3);
// ISO time -> value for a datetime-local input, in the viewer's own time zone.
const local = v => { const d = new Date(v); if (!v || isNaN(d)) return ''; d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

/* ===== Categories ===== */
function categoryForm(c){
  c = c || {type:'vote', method:'tier'};
  const methods = Object.entries(STATE.methods).map(([k, v]) => `<option value="${k}"${c.method === k ? ' selected' : ''}>${esc(v)}</option>`).join('');
  return `<form class="catform" data-id="${esc(c.id || '')}">
    <fieldset><legend>Basics</legend><div class="grid">
      <label>Name<input name="name" value="${esc(c.name)}" required placeholder="e.g. Anime of the Year 2026"></label>
      <label>Type<select name="type"><option value="vote"${c.type !== 'special' ? ' selected' : ''}>Public vote</option><option value="special"${c.type === 'special' ? ' selected' : ''}>Special award / mention (no voting)</option></select></label>
    </div><label>Description (optional)<textarea name="description">${esc(c.description)}</textarea></label></fieldset>
    <fieldset class="voting vote-only"><legend>Voting</legend><div class="grid">
      <label>Voting method<select name="method">${methods}</select></label>
      <label class="picks">How many picks / ranks (N)<input name="max_picks" type="number" min="1" max="20" value="${esc(c.max_picks || '')}" placeholder="3"></label>
    </div></fieldset>

    <div class="row"><button class="primary">${c.id ? 'Save category' : 'Add category'}</button>${c.id ? '' : '<button type="button" data-cancel>Cancel</button>'}</div>
  </form>`;
}

function nomineeForm(catId, n){
  n = n || {};
  return `<form class="nomform" data-cat="${esc(catId)}" data-id="${esc(n.id || '')}">
    <div class="grid">
      <label>Nominee<input name="name" value="${esc(n.name)}" required></label>
      <label>Subtitle (artist, studio…)<input name="subtitle" value="${esc(n.subtitle)}"></label>
      <label>Image link (optional)<input name="image" value="${esc(n.image)}" placeholder="https://…"></label>
      <label>Anime title, for an automatic poster (optional)<input name="image_search" value="${esc(n.image_search)}" placeholder="e.g. Sousou no Frieren 2nd Season"></label>
      <label>Watch / listen link (optional)<input name="link" value="${esc(n.link)}" placeholder="https://youtube.com/…"></label>
    </div>
    <div class="row"><button class="primary">${n.id ? 'Save nominee' : 'Add nominee'}</button>${n.id ? '<button type="button" data-cancel-nom>Cancel</button>' : ''}</div>
  </form>`;
}

function renderCategories(){
  const cats = STATE.categories;
  const list = cats.map((c, i) => {
    const noms = nomsOf(c.id), winners = noms.filter(n => n.winner === 'TRUE');
    const locked = c.locked === 'TRUE';
    const status = (c.type === 'special' ? '<span class="tag special">Special</span>' : open(c) ? '' : '<span class="tag closed">Voting closed</span>')
      + (locked ? '<span class="tag locked">Locked</span>' : '');
    const body = OPEN !== c.id ? '' : `<div class="body">
      ${locked ? `<div class="hint">Locked since it was published for voting: nominees and voting method can't change, so every voter sees the same ballot.
        <button data-unlock="${c.id}" style="margin-left:8px">Unlock</button></div>` : ''}
      ${categoryForm(c)}
      <div class="nominees"><h2>Nominees (${noms.length})</h2>
      ${c.type === 'special' ? '<p class="note">Tick the winner(s). Special awards don\'t appear on the ballot.</p>' : ''}
      ${noms.length ? `<table><tr><th></th><th>Nominee</th><th>Subtitle</th>${c.type === 'special' ? '<th>Winner</th>' : ''}<th></th></tr>
        ${noms.map(n => EDIT_NOM === n.id ? `<tr><td colspan="5">${nomineeForm(c.id, n)}</td></tr>` : `<tr>
          <td>${n.image ? `<img class="thumb" src="${esc(n.image)}" alt="">` : '<span class="thumb"></span>'}</td>
          <td>${esc(n.name)}</td><td class="meta">${esc(n.subtitle)}</td>
          ${c.type === 'special' ? `<td><input type="checkbox" class="win" data-cat="${c.id}" data-id="${n.id}"${n.winner === 'TRUE' ? ' checked' : ''} style="width:auto"></td>` : ''}
          <td class="num">${locked ? '' : `<button class="icon" data-editnom="${n.id}">Edit</button> <button class="icon danger" data-delnom="${n.id}">Delete</button>`}</td></tr>`).join('')}</table>` : '<p class="note">No nominees yet.</p>'}
      ${locked ? '' : `<h2>Add a nominee</h2>${nomineeForm(c.id)}`}</div>
      <div class="row danger-zone"><span class="meta">Deleting removes the category and its nominees.</span><span class="spacer"></span><button class="danger" data-delcat="${c.id}">Delete category</button></div>
    </div>`;
    return `<div class="card cat${c.type === 'special' ? ' special' : ''}${locked ? ' locked' : ''}"><div class="head" data-open="${c.id}">
      <div class="row"><button class="icon" data-move="${c.id}" data-dir="-1"${i ? '' : ' disabled'} title="Move up">↑</button><button class="icon" data-move="${c.id}" data-dir="1"${i < cats.length - 1 ? '' : ' disabled'} title="Move down">↓</button></div>
      <div class="title">${esc(c.name)}${status}<div class="meta">${esc(methodLabel(c))} · ${noms.length} nominees${c.type === 'special' ? '' : ` · ${c.ballots} ballots`}${winners.length ? ` · <span class="done">✓ Winner: ${esc(winners.map(w => w.name).join(', '))}</span>` : ''}</div></div>
      <span class="meta">${OPEN === c.id ? '▲' : '▼'}</span></div>${body}</div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:12px"><span class="note" style="margin:0">Changes are saved right away but only appear on the public site after <b>Publish to site</b>.</span><span class="spacer"></span><button id="posters" title="Look up a poster for every nominee that has an anime title but no picture">Find posters</button><button class="primary" id="addcat">Add category</button></div>
    <div class="legend"><span style="--c:var(--vote)">Public vote</span><span style="--c:var(--special)">Special award</span><span style="--c:var(--lock)">Locked (published)</span></div>
    <div id="newcat"></div>${list || '<p class="note">No categories yet. Add the first one.</p>'}`;
}

/* ===== Proposals ===== */
function catLabel(ref){
  const c = STATE.categories.find(x => x.id === ref); if (c) return c.name;
  const p = STATE.proposals.find(x => x.id === ref); return p ? p.title + ' (proposed, accept it first)' : 'Unknown category';
}
function renderProposals(){
  const list = STATE.proposals;
  return `<p class="note">What the committee proposed on the committee page, most supported first (${STATE.members} members). Accepting adds it to the official ballot under Categories; nothing goes public until you publish.</p>`
    + (list.length ? `<div class="card"><div class="body" style="border:0"><table><tr><th>Support</th><th>Proposal</th><th>Details</th><th></th></tr>${list.map(p => {
      const d = p.details;
      const info = p.kind === 'category' ? (d.type === 'special' ? 'Special award' : (STATE.methods[d.method] || '').replace('N', d.max_picks || 3)) + (d.description ? ' · ' + d.description : '')
        : p.kind === 'method' ? 'For ' + catLabel(p.category_ref) : 'In ' + catLabel(p.category_ref) + (d.subtitle ? ' · ' + d.subtitle : '');
      return `<tr><td><b>👍 ${p.up} · 👎 ${p.down}</b><div class="meta">${esc(p.comments.length)} comments</div></td>
        <td><span class="tag">${p.kind}</span> <b>${esc(p.title)}</b><div class="meta">by ${esc(p.authorName)}</div></td><td class="meta">${esc(info)}</td>
        <td class="num"><button class="icon" data-accept="${p.id}">Accept</button> <button class="icon danger" data-rejectp="${p.id}">Reject</button></td></tr>`;
    }).join('')}</table></div></div>` : '<p class="note">No open proposals.</p>');
}

/* ===== Results ===== */
function renderResults(){
  const cats = STATE.categories.filter(c => c.type !== 'special');
  const vi = STATE.votesInfo;
  if (vi.error) return `<div class="hint">${esc(vi.error)}. Check the votes sheet ID in Settings, and that you have access to that sheet.</div>`;
  if (!cats.length) return '<p class="note">No public-vote categories yet.</p>';
  return '<p class="note">Only the committee sees this. Ranked by points; ties are broken by first-place picks (S tier, rank 1 or a pick). Tick the winner(s) and publish.</p>' + cats.map(c => {
    const r = STATE.results[c.id] || {};
    const rows = nomsOf(c.id).map(n => Object.assign({n}, r[n.id] || {points:0, voters:0, top:0}))
      .sort((a, b) => b.points - a.points || b.top - a.top);
    const tied = rows.length > 1 && rows[0].points > 0 && rows[0].points === rows[1].points && rows[0].top === rows[1].top;
    return `<div class="card"><div class="head"><div class="title">${esc(c.name)}<div class="meta">${esc(methodLabel(c))} · ${c.ballots} ballots${tied ? ' · <b style="color:var(--bad)">Tie for first: committee decides</b>' : ''}</div></div></div>
      <div class="body"><table><tr><th>#</th><th>Nominee</th><th style="text-align:right">Points</th><th style="text-align:right">Voters</th><th style="text-align:right">1st picks</th><th>Winner</th></tr>
      ${rows.map((x, i) => `<tr class="${tied && x.points === rows[0].points && x.top === rows[0].top ? 'tie' : ''}"><td>${i + 1}</td><td>${esc(x.n.name)}</td>
        <td class="num">${x.points}</td><td class="num">${x.voters}</td><td class="num">${x.top}</td>
        <td><input type="checkbox" class="win" data-cat="${c.id}" data-id="${x.n.id}"${x.n.winner === 'TRUE' ? ' checked' : ''} style="width:auto"></td></tr>`).join('')}</table></div></div>`;
  }).join('');
}

/* ===== Settings ===== */
const SETTING_GROUPS = [
  ['Event', '', [['title', 'Event title', 'text'], ['tagline', 'Tagline', 'text'], ['date', 'Ceremony date and time', 'datetime-local'],
    ['venue', 'Venue', 'text'], ['stream_url', 'Livestream link', 'text']]],
  ['Voting & reveal', 'reveal', [['vote_open', 'Voting open', 'bool'], ['voting_opens', 'Voting starts (optional)', 'datetime-local'],
    ['voting_closes', 'Voting ends (optional)', 'datetime-local'], ['reveal_winners', 'Reveal winners on the site', 'bool'],
    ['show_results', 'Show points on the site', 'bool']]],
  ['Social links', '', [['facebook_url', 'Facebook link', 'text'], ['youtube_url', 'YouTube link', 'text'], ['discord_url', 'Discord link', 'text']]],
  ['Votes data', 'voting', [['votes_sheet_id', 'Votes spreadsheet ID (blank = this sheet)', 'text'], ['votes_tab', 'Votes tab name', 'text']]]];
function settingField([k, label, type]){
  const s = STATE.settings;
  return type === 'bool'
    ? `<label>${label}<select name="${k}" class="${s[k] === 'TRUE' ? 'yes' : 'no'}"><option value="TRUE"${s[k] === 'TRUE' ? ' selected' : ''}>Yes</option><option value="FALSE"${s[k] !== 'TRUE' ? ' selected' : ''}>No</option></select></label>`
    : `<label>${label}<input name="${k}" type="${type}" value="${esc(type === 'datetime-local' ? local(s[k]) : s[k])}"></label>`;
}
function renderSettings(){
  const vi = STATE.votesInfo;
  const source = vi.error ? `<b style="color:var(--bad)">${esc(vi.error)}</b>`
    : `Reading <a href="${esc(vi.url)}" target="_blank">${esc(vi.name)}</a> → tab “${esc(vi.tab)}” · ${vi.rows} vote rows`
      + (vi.missing.length ? ` · <b style="color:var(--bad)">columns not found for: ${esc(vi.missing.join(', '))}</b>` : ' · all columns mapped');
  return `<form id="settings" class="card"><div class="body" style="border:0">${SETTING_GROUPS.map(([title, cls, fields]) =>
    `<fieldset class="${cls}"><legend>${title}</legend><div class="grid">${fields.map(settingField).join('')}</div>
     ${title === 'Votes data' ? `<p class="note">${source}<br>The spreadsheet ID is the long code in its link: docs.google.com/spreadsheets/d/<b>ID</b>/edit. Map its columns in this sheet's VotesMapping tab.</p>` : ''}
     ${title === 'Voting & reveal' ? '<p class="note">Voting starts/ends apply to every category: the ballot opens and closes by itself at those times (leave blank for no limit). Voting open = No closes it right away. After the ceremony: Voting open → No, Reveal winners → Yes, then Publish.</p>' : ''}</fieldset>`).join('')}
    <div class="row"><button class="primary">Save settings</button><span class="meta">Settings go live on the site right away; no publish needed.</span></div></div></form>`;
}

function renderActivity(){
  return `<div class="card"><div class="body" style="border:0"><table><tr><th>When</th><th>Who</th><th>What</th></tr>${STATE.log.map(l =>
    `<tr><td class="meta">${esc(new Date(l.Timestamp).toLocaleString())}</td><td>${esc(l.Email)}</td><td>${esc(l.Action)} <span class="meta">${esc(l.Details)}</span></td></tr>`).join('') || '<tr><td colspan="3" class="note">Nothing yet.</td></tr>'}</table></div></div>`;
}

function render(){
  $('#me').textContent = STATE.email;
  const st = STATE.settings, cats = STATE.categories;
  const ballots = cats.reduce((n, c) => n + (Number(c.ballots) || 0), 0);
  $('#status').innerHTML = [
    (() => { const now = new Date(), o = st.voting_opens && new Date(st.voting_opens), c = st.voting_closes && new Date(st.voting_closes);
      if (st.vote_open !== 'TRUE') return '<span class="pill off"><i></i>Voting closed</span>';
      if (o && now < o) return `<span class="pill warn"><i></i>Voting starts ${o.toLocaleString()}</span>`;
      if (c && now > c) return '<span class="pill off"><i></i>Voting ended</span>';
      return `<span class="pill on"><i></i>Voting open${c ? ' until ' + c.toLocaleString() : ''}</span>`; })(),
    st.reveal_winners === 'TRUE' ? '<span class="pill on"><i></i>Winners revealed</span>' : '<span class="pill"><i></i>Winners hidden</span>',
    STATE.unpublished ? '<span class="pill warn"><i></i>Unpublished changes</span>' : '<span class="pill on"><i></i>Site up to date</span>',
    `<span class="pill">${cats.length} categories · ${STATE.nominees.length} nominees · ${ballots} ballots</span>`,
    STATE.proposals.length ? `<span class="pill warn" style="cursor:pointer" data-tab="proposals"><i></i>${STATE.proposals.length} proposals to review</span>` : ''
  ].join('');
  $('#publish').classList.toggle('dirty', !!STATE.unpublished);
  $('#publish').title = STATE.unpublished ? 'Changes since the last publish are not on the website yet' : 'The website is up to date';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  $('[data-tab=proposals]').textContent = STATE.proposals.length ? `Proposals (${STATE.proposals.length})` : 'Proposals';
  $('#main').innerHTML = {proposals:renderProposals, categories:renderCategories, results:renderResults, settings:renderSettings, activity:renderActivity}[TAB]();
  document.querySelectorAll('.catform').forEach(f => {
    syncForm(f);
    const c = STATE.categories.find(x => x.id === f.dataset.id);
    if (c && c.locked === 'TRUE') ['type', 'method', 'max_picks'].forEach(k => f[k].disabled = true);
  });
}

// Show only the fields that apply to the chosen type and method.
function syncForm(f){
  const special = f.type.value === 'special', m = f.method.value;
  f.querySelectorAll('.vote-only').forEach(el => el.style.display = special ? 'none' : '');
  f.querySelector('.picks').style.display = special || !(m === 'multi' || m === 'rank') ? 'none' : '';
}

const data = f => Object.fromEntries(new FormData(f).entries());
const iso = v => v ? new Date(v).toISOString() : '';

document.addEventListener('change', e => {
  if (e.target.matches('select.yes, select.no')) e.target.className = e.target.value === 'TRUE' ? 'yes' : 'no';
  const f = e.target.closest('.catform'); if (f) syncForm(f);
  if (e.target.classList.contains('win')){
    const ids = [...document.querySelectorAll(`.win[data-cat="${e.target.dataset.cat}"]`)].filter(x => x.checked).map(x => x.dataset.id);
    call('adminSetWinners', e.target.dataset.cat, ids).then(s => s && toast('Winners updated. Publish to show them on the site.'));
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.classList.contains('catform')){
    const d = data(f); d.id = f.dataset.id;
    call('adminSaveCategory', d).then(s => { if (s){ toast('Category saved'); if (!d.id){ OPEN = s.categories[s.categories.length - 1].id; render(); } } });
  } else if (f.classList.contains('nomform')){
    const d = data(f); d.id = f.dataset.id; d.category_id = f.dataset.cat;
    call('adminSaveNominee', d).then(s => { if (s){ EDIT_NOM = null; render(); toast('Nominee saved'); } });
  } else if (f.id === 'settings'){
    const d = data(f); ['date', 'voting_opens', 'voting_closes'].forEach(k => d[k] = iso(d[k]));
    call('adminSaveSettings', d).then(s => s && toast('Settings saved'));
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open],.pill[data-tab]'); if (!t) return;
  if (t.dataset.tab){ TAB = t.dataset.tab; render(); return; }
  if (t.id === 'posters'){ call('adminFillPosters').then(s => s && toast(s.message)); return; }
  if (t.id === 'addcat'){ $('#newcat').innerHTML = `<div class="card"><div class="body" style="border:0">${categoryForm()}</div></div>`; syncForm($('#newcat form')); return; }
  if ('cancel' in t.dataset){ $('#newcat').innerHTML = ''; return; }
  if ('cancelNom' in t.dataset){ EDIT_NOM = null; render(); return; }
  if (t.dataset.move){ e.stopPropagation(); call('adminMoveCategory', t.dataset.move, Number(t.dataset.dir)); return; }
  if (t.dataset.unlock){ if (confirm('Unlock this category? Changing nominees after people have voted can make results unfair.')) call('adminUnlockCategory', t.dataset.unlock); return; }
  if (t.dataset.accept){ call('adminDecideProposal', t.dataset.accept, 'accept').then(s => s && toast('Accepted: added to the official ballot')); return; }
  if (t.dataset.rejectp){ if (confirm('Reject this proposal?')) call('adminDecideProposal', t.dataset.rejectp, 'reject'); return; }
  if (t.dataset.editnom){ EDIT_NOM = t.dataset.editnom; render(); return; }
  if (t.dataset.delnom){ if (confirm('Delete this nominee?')) call('adminDeleteNominee', t.dataset.delnom); return; }
  if (t.dataset.delcat){ if (confirm('Delete this category and all its nominees?')){ OPEN = null; call('adminDeleteCategory', t.dataset.delcat); } return; }
  if (t.id === 'publish'){ if (confirm('Publish categories, nominees and winners to the public site? Public-vote categories with nominees will be locked.')) call('adminPublish').then(s => s && toast('Published. The site updates within a few minutes.')); return; }
  if (t.dataset.open && !e.target.closest('button')){ OPEN = OPEN === t.dataset.open ? null : t.dataset.open; EDIT_NOM = null; render(); }
});

google.script.run.withSuccessHandler(s => { STATE = s; render(); })
  .withFailureHandler(e => { $('#main').innerHTML = `<div class="hint">${esc(e.message || e)}</div>`; }).adminState();
</script>
</body>
</html>
