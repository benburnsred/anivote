name: Deploy AniVote to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # lets the cover-art step commit downloaded images back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Download cover art for awards nominees into the repo, so pages don't depend on anime APIs at runtime.
      # A failure here never blocks the deploy; pages fall back to looking covers up in the browser.
      - name: Fetch awards cover art
        continue-on-error: true
        run: |
          python3 awards/tools/fetch_covers.py
          if [ -n "$(git status --porcelain awards)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add awards
            git commit -m "Add awards cover art"
            git push
          fi
      # Sharpen small round profile pictures (awards/img/<year>/*-avatar.png) 4x with Real-ESRGAN, once each.
      # Dependencies are only installed when some avatar has no -hd copy yet; a failure never blocks the deploy.
      - name: Upscale awards avatars
        continue-on-error: true
        run: |
          PENDING="$(python3 awards/tools/upscale_avatars.py --pending)"
          if [ -z "$PENDING" ]; then echo "avatars: nothing to upscale"; exit 0; fi
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow numpy
          mkdir -p /tmp/esrgan
          curl -fsSL -o /tmp/esrgan/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          curl -fsSL -o /tmp/esrgan/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          python3 awards/tools/upscale_avatars.py
          if [ -n "$(git status --porcelain awards)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add awards
            git commit -m "Upscale awards avatars"
            git pull --rebase -q origin main
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
