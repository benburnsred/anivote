<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07070c">
<title>AniVote Awards</title>
<meta name="description" content="The community anime awards — categories, nominees and winners.">
<style>
:root{--bg:#07070c;--panel:#11111a;--panel2:#191926;--ink:#f4f1ea;--muted:#9c98a8;--line:#262435;--gold:#e9c46a;--gold2:#b8862b;--glow:rgba(233,196,106,.18)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 16px}

/* Top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,12,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:800;text-decoration:none;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1306;border-color:transparent;box-shadow:0 6px 24px var(--glow)}
.btn:hover{filter:brightness(1.08)}

/* Hero */
.hero{position:relative;text-align:center;padding:84px 0 64px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:140%;background:radial-gradient(closest-side,rgba(233,196,106,.22),transparent 70%),radial-gradient(600px 300px at 20% 80%,rgba(124,92,255,.18),transparent 70%),radial-gradient(600px 300px at 80% 70%,rgba(255,93,122,.12),transparent 70%);pointer-events:none}
.beams{position:absolute;inset:0;pointer-events:none;background:conic-gradient(from 200deg at 50% -10%,transparent 0 40%,rgba(233,196,106,.07) 45%,transparent 50%,rgba(233,196,106,.05) 55%,transparent 60%);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(4deg) scale(1.05)}}
.hero .wrap{position:relative}
.trophy{width:72px;height:72px;margin:0 auto 18px;filter:drop-shadow(0 8px 30px rgba(233,196,106,.45))}
.kicker{font-size:12px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(38px,8vw,84px);line-height:1;margin:14px 0 16px;font-weight:950;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 30%,#e9c46a 75%,#a8791f);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:#cfcad8;font-size:clamp(15px,2.2vw,19px);max-width:640px;margin:0 auto}
.when{margin-top:18px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.count{display:flex;justify-content:center;gap:10px;margin:26px 0 4px}
.count div{min-width:76px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:rgba(17,17,26,.7)}
.count b{display:block;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.count span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.status{display:inline-block;margin-top:22px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.status b{color:var(--gold)}

/* Category nav */
.catnav{position:sticky;top:60px;z-index:20;background:rgba(7,7,12,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.catnav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.catnav .wrap::-webkit-scrollbar{display:none}
.catnav a{flex:none;text-decoration:none;font-size:13px;font-weight:750;color:var(--muted);padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
.catnav a:hover,.catnav a.on{color:var(--ink);border-color:var(--gold2)}
.catnav a .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}

/* Categories */
.cat{padding:56px 0 8px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cat-num{font-size:12px;font-weight:900;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.cat h2{font-size:clamp(24px,4vw,36px);margin:4px 0 4px;line-height:1.1;letter-spacing:-.01em}
.cat p{margin:0;color:var(--muted);max-width:640px}
.pill{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.win{color:#1a1306;background:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.nom{position:relative;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .2s,opacity .3s,border-color .2s;text-decoration:none;display:block}
a.nom:hover{transform:translateY(-3px);border-color:#3a3750}
.nom .art{aspect-ratio:3/4;background:linear-gradient(140deg,#2a2440,#141320);background-size:cover;background-position:center;display:grid;place-items:center;font-size:40px;font-weight:950;color:rgba(255,255,255,.18);letter-spacing:-.04em}
.nom .info{position:absolute;inset:auto 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(7,7,12,.95) 45%)}
.nom .name{font-weight:850;font-size:15px;line-height:1.2}
.nom .sub{font-size:12px;color:#bdb8c9;margin-top:2px;line-height:1.3}
.nom .res{margin-top:6px;font-size:12px;font-weight:900;color:var(--gold)}
.has-winner .nom:not(.winner){opacity:.42;filter:saturate(.4)}
.nom.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 14px 40px var(--glow);grid-column:span 2;grid-row:span 2;min-height:420px}
.nom.winner .art{position:absolute;inset:0;aspect-ratio:auto}
.nom.winner .name{font-size:22px}
.ribbon{position:absolute;top:12px;left:12px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1306;font-size:11px;font-weight:950;letter-spacing:.18em;padding:5px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.nom.tba .art{background:repeating-linear-gradient(135deg,#12121b 0 12px,#161622 12px 24px)}
.nom.tba .art::after{content:"?";font-size:46px;color:#2e2c3f}
.shimmer{position:relative;overflow:hidden}
.shimmer::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.04) 50%,transparent 70%);animation:shim 2.4s infinite;z-index:1}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.note{color:var(--muted);text-align:center;padding:60px 16px}
.err{color:#ffb4b4}

footer{border-top:1px solid var(--line);margin-top:70px;padding:30px 0 50px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--gold)}
@media (max-width:600px){.hero{padding:56px 0 44px}.count div{min-width:64px}.count b{font-size:24px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.nom.winner{grid-row:auto;min-height:0}.nom.winner .art{position:static;aspect-ratio:4/3}.nom.winner .name{font-size:18px}.top .btn{padding:8px 14px}}
@media (prefers-reduced-motion:reduce){.beams,.shimmer::before{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#"><i>★</i><span id="brandName">AniVote Awards</span></a>
  <a class="btn gold" id="topVote" href="vote/" hidden>Vote now</a>
</div></header>

<section class="hero">
  <div class="beams"></div>
  <div class="wrap">
    <svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#e9c46a"/><stop offset="1" stop-color="#a8791f"/></linearGradient></defs><path fill="url(#g)" d="M18 6h28v6h10v6c0 8-6 14-13 15-2 5-6 8-9 9v6h8l2 8H20l2-8h8v-6c-3-1-7-4-9-9C14 32 8 26 8 18v-6h10V6zm-6 10v2c0 5 3 9 7 10-1-3-1-6-1-9v-3h-6zm34 0v3c0 3 0 6-1 9 4-1 7-5 7-10v-2h-6z"/></svg>
    <div class="kicker" id="kicker">The Community Anime Awards</div>
    <h1 id="title">AniVote Awards</h1>
    <p class="tagline" id="tagline"></p>
    <div class="when" id="when"></div>
    <div class="count" id="count" hidden></div>
    <div class="ctas">
      <a class="btn gold" id="heroVote" href="vote/" hidden>Vote now</a>
      <a class="btn" id="heroWatch" href="#" target="_blank" rel="noopener" hidden>▶ Watch live</a>
      <a class="btn" href="#categories">See the categories</a>
    </div>
    <div class="status" id="status" hidden></div>
  </div>
</section>

<nav class="catnav" id="catnav" hidden><div class="wrap" id="catlinks"></div></nav>
<main class="wrap" id="categories"><div class="note">Loading the nominees…</div></main>

<footer><div class="wrap">AniVote Awards · <a href="vote/">Cast your vote</a> · <a href="../">AniVote polls</a></div></footer>

<script>
/* ===== Config =====
 * Where the awards content comes from. Use the bundled CSVs, or a Google Sheet tab published as CSV
 * (File → Share → Publish to web → pick the tab → CSV). See awards/README.md for the column layout. */
const NOMINEES_CSV = 'data/nominees.csv';
const SETTINGS_CSV = 'data/settings.csv';
const REFRESH_SECONDS = 60; // re-check the sheet so winners appear live during the ceremony

const DEFAULTS = {title:'AniVote Awards', tagline:'', date:'', venue:'', stream_url:'', vote_url:'vote/',
  vote_open:'TRUE', reveal_winners:'FALSE', show_results:'FALSE'};

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yes = v => /^(true|yes|y|1|x|✓|✔|winner)$/i.test(String(v || '').trim());
const safeUrl = u => { u = String(u || '').trim(); return /^(https?:\/\/|\.{0,2}\/|[\w-]+\/)/i.test(u) && !/^\s*javascript:/i.test(u) ? u : ''; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const initials = s => String(s).replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const store = {get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};

// Accepts a "Publish to web" CSV link, or a normal Sheets link (which then needs "Anyone with the link can view").
function csvUrl(u){
  const m = u.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (!m || /output=csv|tqx=out:csv/.test(u)) return u;
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
}

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

async function getCSV(u){
  const res = await fetch(csvUrl(u) + (u.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 30000), {cache:'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*<!doctype html|<html/i.test(text)) throw new Error('the sheet is not published or shared');
  return parseCSV(text);
}

/* ===== Data ===== */
function build(rows){
  const cats = [];
  const byName = {};
  for (const r of rows){
    const name = r.category; if (!name) continue;
    let c = byName[name];
    if (!c){ c = byName[name] = {name, id:slug(name), desc:'', noms:[]}; cats.push(c); }
    if (r.category_description && !c.desc) c.desc = r.category_description;
    if (r.nominee) c.noms.push({name:r.nominee, sub:r.subtitle, image:safeUrl(r.image), search:r.image_search, link:safeUrl(r.link), winner:yes(r.winner), result:r.result});
  }
  return cats;
}

/* ===== Rendering ===== */
let S = {...DEFAULTS}, CATS = [], lastKey = '', covers = store.get('aw.show.covers', {});

function nomHTML(n, reveal, showRes){
  const img = n.image || covers[n.search] || '';
  const tag = n.link ? 'a' : 'div';
  const win = reveal && n.winner;
  return `<${tag} class="nom${win ? ' winner' : ''}"${n.link ? ` href="${esc(n.link)}" target="_blank" rel="noopener"` : ''}>
    <div class="art"${img ? ` style="background-image:url('${esc(img)}')"` : ''}>${img ? '' : esc(initials(n.name))}</div>
    ${win ? '<span class="ribbon">★ WINNER</span>' : ''}
    <div class="info"><div class="name">${esc(n.name)}</div>${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ''}
    ${showRes && n.result ? `<div class="res">${esc(n.result)}</div>` : ''}</div></${tag}>`;
}

function render(){
  const reveal = yes(S.reveal_winners), showRes = yes(S.show_results), voteOpen = yes(S.vote_open);
  document.title = S.title;
  $('#title').textContent = S.title; $('#brandName').textContent = S.title;
  $('#tagline').textContent = S.tagline;
  const voteUrl = safeUrl(S.vote_url) || 'vote/';
  ['#topVote', '#heroVote'].forEach(id => { $(id).hidden = !voteOpen; $(id).href = voteUrl; });
  const watch = safeUrl(S.stream_url); $('#heroWatch').hidden = !watch; if (watch) $('#heroWatch').href = watch;

  const d = S.date ? new Date(S.date) : null;
  const when = [d && !isNaN(d) ? d.toLocaleString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}) : 'Date to be announced', S.venue].filter(Boolean);
  $('#when').textContent = when.join(' · ');
  tick();

  const won = CATS.filter(c => c.noms.some(n => n.winner)).length;
  const named = CATS.filter(c => c.noms.length).length;
  const st = $('#status');
  st.hidden = !CATS.length;
  st.innerHTML = reveal ? `<b>${won}</b> of ${CATS.length} winners announced`
    : named < CATS.length ? `<b>${CATS.length}</b> categories · nominees for ${named} announced` : `<b>${CATS.length}</b> categories · nominees announced`;

  $('#catnav').hidden = !CATS.length;
  $('#catlinks').innerHTML = CATS.map(c => `<a href="#${c.id}">${esc(c.name)}${reveal && c.noms.some(n => n.winner) ? '<span class="dot"></span>' : ''}</a>`).join('');

  $('#categories').innerHTML = CATS.length ? CATS.map((c, i) => {
    const hasWin = reveal && c.noms.some(n => n.winner);
    // Winner first, then the rest in sheet order.
    const noms = hasWin ? [...c.noms.filter(n => n.winner), ...c.noms.filter(n => !n.winner)] : c.noms;
    const pill = hasWin ? '<span class="pill win">Winner announced</span>' : c.noms.length ? `<span class="pill">${c.noms.length} nominees</span>` : '<span class="pill">Nominees coming soon</span>';
    const body = c.noms.length ? noms.map(n => nomHTML(n, reveal, showRes)).join('')
      : Array.from({length:5}, () => '<div class="nom tba shimmer"><div class="art"></div><div class="info"><div class="name">To be announced</div></div></div>').join('');
    return `<section class="cat" id="${c.id}"><div class="cat-head"><div><div class="cat-num">Category ${String(i + 1).padStart(2, '0')}</div>
      <h2>${esc(c.name)}</h2>${c.desc ? `<p>${esc(c.desc)}</p>` : ''}</div>${pill}</div>
      <div class="grid${hasWin ? ' has-winner' : ''}">${body}</div></section>`;
  }).join('') : '<div class="note">Categories will be announced soon. Stay tuned!</div>';
}

function tick(){
  const d = S.date ? new Date(S.date) : null, el = $('#count');
  const ms = d && !isNaN(d) ? d - Date.now() : -1;
  if (ms <= 0){ el.hidden = true; return; }
  const u = [['Days', 864e5], ['Hours', 36e5], ['Min', 6e4], ['Sec', 1e3]]; let r = ms;
  el.innerHTML = u.map(([l, v]) => { const n = Math.floor(r / v); r -= n * v; return `<div><b>${String(n).padStart(2, '0')}</b><span>${l}</span></div>`; }).join('');
  el.hidden = false;
}
setInterval(tick, 1000);

/* ===== Load ===== */
async function load(){
  try {
    const [rows, settings] = await Promise.all([getCSV(NOMINEES_CSV), SETTINGS_CSV ? getCSV(SETTINGS_CSV).catch(() => []) : []]);
    const key = JSON.stringify([rows, settings]);
    if (key === lastKey) return;
    lastKey = key;
    S = {...DEFAULTS};
    settings.forEach(r => { if (r.key) S[r.key.trim().toLowerCase()] = r.value; });
    CATS = build(rows);
    render();
    loadCovers();
  } catch (e){
    if (!lastKey) $('#categories').innerHTML = `<div class="note err">Couldn't load the awards (${esc(e.message)}).</div>`;
  }
}

// Cover art for nominees with an image_search value and no image (Jikan / MyAnimeList, ~3 requests/s).
let loadingCovers = false;
async function loadCovers(){
  if (loadingCovers) return; loadingCovers = true;
  for (const c of CATS) for (const n of c.noms){
    if (n.image || !n.search || covers[n.search]) continue;
    try {
      const j = await (await fetch('https://api.jikan.moe/v4/anime?limit=1&q=' + encodeURIComponent(n.search))).json();
      const url = j.data?.[0]?.images?.webp?.large_image_url || j.data?.[0]?.images?.jpg?.large_image_url;
      if (url){ covers[n.search] = url; store.set('aw.show.covers', covers); render(); }
    } catch (e){}
    await new Promise(r => setTimeout(r, 450));
  }
  loadingCovers = false;
}

// Highlight the category in view.
addEventListener('scroll', () => {
  let cur = '';
  document.querySelectorAll('.cat').forEach(s => { if (s.getBoundingClientRect().top < 160) cur = s.id; });
  document.querySelectorAll('#catlinks a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
}, {passive:true});

load();
if (REFRESH_SECONDS) setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
